# ==============================================================================
# Google Cloud Build Configuration — ScamShield Live
# Automates CI/CD container build & deployment to Google Cloud Run
# ==============================================================================

steps:
  # 1. Build Backend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.backend'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scamshield-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scamshield-backend:latest'
      - '.'

  # 2. Build Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scamshield-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/scamshield-frontend:latest'
      - './apps/web'

  # 3. Push Backend Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scamshield-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scamshield-backend:latest']

  # 4. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scamshield-frontend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scamshield-frontend:latest']

  # 5. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scamshield-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scamshield-backend:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DEMO_MODE=true,HOST=0.0.0.0,PORT=8080'

  # 6. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scamshield-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scamshield-frontend:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/scamshield-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/scamshield-backend:latest'
  - 'gcr.io/$PROJECT_ID/scamshield-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/scamshield-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
