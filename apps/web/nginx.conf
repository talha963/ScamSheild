server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API calls to backend
    location /v1/ {
        proxy_pass http://scamshield-backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket reverse proxy for audio streaming
    location ~* ^/v1/calls/.+/audio {
        proxy_pass http://scamshield-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Reverse proxy Mock Bank API
    location /bank/ {
        proxy_pass http://scamshield-backend:8000/bank/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend Health Check
    location /health {
        proxy_pass http://scamshield-backend:8000/health;
        proxy_set_header Host $host;
    }
}
